services:
  # API conectada a la base de Supabase: toma DATABASE_URL, JWT_SECRET, etc. del archivo .env
  #   docker compose up --build
  api:
    build: .
    env_file: .env
    environment:
      TIMEZONE: America/Lima
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Postgres local OPCIONAL, solo para trabajar sin internet o correr pruebas sin tocar Supabase:
  #   docker compose --profile local up -d db
  # y en el .env: TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/fiadoclaro_test
  db:
    profiles: ["local"]
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fiadoclaro
      TZ: America/Lima
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
